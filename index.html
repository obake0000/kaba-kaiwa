<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>💋 キャバ会話C：紙芝居版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none}
  body{
    font-family:"Yu Gothic UI","Meiryo UI",system-ui,sans-serif;
    background:#000;color:#fff;min-height:100vh;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  #root{width:100vw;height:100vh;position:relative;background:#0a0014}
  #skip{
    position:fixed;top:14px;right:14px;z-index:1000;
    background:rgba(0,0,0,.6);color:#ff8ad0;border:1px solid #ff5a9a;
    padding:6px 14px;border-radius:18px;font-size:12px;cursor:pointer;
    font-family:inherit;letter-spacing:.05em;
  }
  #skip:hover{background:#ff5a9a;color:#fff}
  #skip.hide{display:none}
  #bgm{
    position:fixed;top:14px;left:14px;z-index:1000;
    background:rgba(0,0,0,.6);color:#fff;border:1px solid #555;
    padding:6px 12px;border-radius:18px;font-size:11px;cursor:pointer;
    font-family:inherit;
  }
  #bgm:hover{border-color:#ffd23a;color:#ffd23a}

  /* タイトル */
  .title-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:28px 20px 24px;overflow-y:auto;background:#0a0014}
  .title-bg-img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.45;filter:saturate(.9)}
  .title-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,.55) 25%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.85) 100%);z-index:1}
  .title-top,.title-bottom{position:relative;z-index:2;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center}
  .title-logo{font-size:46px;font-weight:900;color:#ff5a9a;letter-spacing:.12em;margin-bottom:4px;animation:pulse 2s ease-in-out infinite;line-height:1;
    text-shadow:
      -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
      4px 4px 0 #5af0e0,
      0 0 20px #ff5a9a;}
  .title-sub{font-size:13px;color:#ffd23a;letter-spacing:.2em;font-weight:bold;margin-bottom:16px;
    text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 10px #ffd23a;}
  .title-hook{font-size:34px;font-weight:900;color:#fff;background:linear-gradient(90deg,rgba(217,46,46,.95),rgba(255,90,154,.95),rgba(255,210,58,.95));padding:14px 32px;border-radius:18px;letter-spacing:.04em;margin-bottom:10px;border:3px solid #fff;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000;animation:hookPulse 1.8s ease-in-out infinite;box-shadow:0 0 32px rgba(255,90,154,.7),6px 6px 0 #000;line-height:1.15}
  @keyframes hookPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04);filter:brightness(1.15)}}
  .title-hook-sub{font-size:14px;color:#ff8ad0;font-style:italic;margin-bottom:6px;text-shadow:1px 1px 0 #000,0 0 8px #ff5a9a;letter-spacing:.05em}
  @keyframes pulse{50%{filter:brightness(1.25)}}
  .title-demo{width:100%;max-width:560px;background:rgba(0,0,0,.88);border:4px solid #fff;border-radius:14px;padding:14px 16px;backdrop-filter:blur(6px);box-shadow:6px 6px 0 #000,0 0 24px rgba(255,90,154,.5);margin-bottom:14px;position:relative}
  .title-demo::before{content:"⚡実演";position:absolute;top:-12px;left:14px;background:#ffd23a;color:#000;font-size:11px;font-weight:900;padding:3px 10px;border:2px solid #000;border-radius:10px;letter-spacing:.1em}
  .demo-label{font-size:10px;color:#ff8ad0;letter-spacing:.25em;text-align:center;margin-bottom:8px;font-weight:bold}
  .demo-quest{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
  .demo-icon{font-size:32px;flex-shrink:0;line-height:1}
  .demo-text{background:#fff7e0;color:#000;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.5;flex:1;font-weight:900;border:3px solid #000;position:relative;box-shadow:3px 3px 0 #ff5a9a}
  .demo-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .demo-choice{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:900;border:3px solid;text-align:left;line-height:1.3;box-shadow:2px 2px 0 #000}
  .demo-choice.ok{background:#5af0a0;color:#000;border-color:#000}
  .demo-choice.ng{background:#ff5050;color:#fff;border-color:#000;text-shadow:1px 1px 0 #000}
  .demo-inner{background:rgba(255,90,154,.2);border:2px solid #ff5a9a;border-left:6px solid #ff5a9a;padding:8px 12px;border-radius:6px;color:#ff8ad0;font-size:12px;font-style:italic;text-align:left;font-weight:bold}
  .title-specs{display:flex;justify-content:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .title-specs span{background:rgba(0,0,0,.75);padding:6px 14px;border-radius:18px;font-size:12px;color:#ffd23a;border:1px solid #ffd23a;font-weight:bold;letter-spacing:.05em}
  /* パターン切替バー */
  .pattern-bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);border:2px solid #ffd23a;border-radius:24px;padding:6px 10px;z-index:200;display:flex;gap:6px;backdrop-filter:blur(8px)}
  .pattern-bar .label{font-size:10px;color:#ffd23a;font-weight:bold;padding:6px 8px;letter-spacing:.1em}
  .pattern-bar button{font-family:inherit;font-size:11px;font-weight:bold;padding:6px 14px;background:#3a1a3a;color:#ff8ad0;border:2px solid #5a2a5a;border-radius:18px;cursor:pointer}
  .pattern-bar button.active{background:#ff5a9a;color:#fff;border-color:#fff;box-shadow:0 0 12px rgba(255,90,154,.6)}
  /* コピー切替バー（通常は非表示、?dev で表示） */
  .copy-bar{display:none;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);border:2px solid #5af0e0;border-radius:24px;padding:6px 8px;z-index:200;gap:4px;backdrop-filter:blur(8px);align-items:center}
  body.dev-mode .copy-bar{display:flex}
  .copy-bar .label{font-size:10px;color:#5af0e0;font-weight:bold;padding:0 8px;letter-spacing:.1em}
  .copy-bar button{font-family:inherit;font-size:11px;font-weight:bold;width:28px;height:28px;background:#1a2a3a;color:#5af0e0;border:2px solid #2a4a5a;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .copy-bar button.active{background:#5af0e0;color:#000;border-color:#fff;box-shadow:0 0 10px rgba(90,240,224,.6)}
  .copy-bar .name{font-size:11px;color:#fff;padding:0 8px;font-style:italic;min-width:120px;text-align:center;letter-spacing:.05em}
  .copy-bar .edit-btn{font-family:inherit;font-size:11px;padding:6px 10px;background:#1a1a3a;color:#ffd23a;border:2px solid #ffd23a;border-radius:18px;cursor:pointer;font-weight:bold;margin-left:6px}
  .copy-bar .edit-btn:hover{background:#ffd23a;color:#000}
  /* タイトル画面常設の編集ボタン */
  .edit-floating{position:fixed;bottom:14px;right:14px;background:rgba(0,0,0,.8);color:#ffd23a;border:2px solid #ffd23a;border-radius:24px;padding:8px 16px;font-size:13px;font-weight:bold;cursor:pointer;z-index:200;font-family:inherit;letter-spacing:.05em;box-shadow:3px 3px 0 #000}
  .edit-floating:hover{background:#ffd23a;color:#000}
  /* パターンA：コミック調 */
  .title-comic-mode{position:absolute;inset:0;overflow-y:auto;background:linear-gradient(180deg,#0a0014,#2a0a3a,#1a0014);padding:10px;color:#fff}
  .title-comic-mode .comic-wrap{max-width:980px;margin:0 auto}
  .title-comic-mode .start-btn-comic{cursor:pointer;animation:startPulse 1.4s ease-in-out infinite;background:radial-gradient(circle at 30% 30%,#ff5050,#8a0000);border:4px solid #fff;border-radius:14px;padding:8px 4px;text-align:center;box-shadow:5px 5px 0 #000,0 0 16px rgba(255,80,80,.6);transform:rotate(-3deg);position:relative}
  .title-comic-mode .start-btn-comic .lbl{font-size:14px;font-weight:900;color:#fff;text-shadow:2px 2px 0 #000;letter-spacing:.1em}
  .title-comic-mode .start-btn-comic .val{font-size:32px;font-weight:900;color:#fff;text-shadow:3px 3px 0 #000;line-height:1;font-family:"Yu Gothic UI",sans-serif}
  .title-comic-mode .start-btn-comic .suf{font-size:11px;color:#fff;text-shadow:2px 2px 0 #000}
  .title-comic-mode .start-btn-comic:hover{filter:brightness(1.2)}
  .title-comic-mode .start-btn-comic:active{transform:rotate(0deg) scale(.96)}
  @keyframes startPulse{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(2deg) scale(1.06)}}
  .title-comic-mode .comic-title-box h1{font-size:38px}
  .title-comic-mode .comic-title-box .sub{font-size:14px;margin-top:4px}
  .title-comic-mode .comic-title-box .hook{font-size:15px;color:#ff8ad0;margin-top:8px;font-weight:bold;text-shadow:1px 1px 0 #000}
  .title-comic-mode .comic-cust .face img{display:block}
  .title-comic-mode .comic-bubble{font-size:18px}
  .title-comic-mode .demo-cycle{transition:opacity .4s}
  .title-comic-mode .demo-cycle.fade{opacity:0}
  /* パターンC：ミニマル映画ポスター */
  .title-poster{position:absolute;inset:0;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .title-poster .poster-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.7;filter:saturate(1.1)}
  .title-poster .poster-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.85) 100%)}
  .title-poster .poster-content{position:relative;z-index:2;text-align:center;padding:20px}
  .title-poster .poster-logo{font-size:96px;font-weight:900;color:#ff5a9a;letter-spacing:.1em;text-shadow:-4px -4px 0 #000,4px -4px 0 #000,-4px 4px 0 #000,4px 4px 0 #000,8px 8px 0 #5af0e0,0 0 30px #ff5a9a;line-height:1;margin-bottom:8px}
  .title-poster .poster-tag{font-size:18px;color:#ffd23a;letter-spacing:.3em;font-weight:bold;text-shadow:2px 2px 0 #000;margin-bottom:6px}
  .title-poster .poster-catch{font-size:22px;color:#fff;font-weight:900;background:rgba(0,0,0,.6);padding:8px 24px;border-top:3px solid #ff5a9a;border-bottom:3px solid #ff5a9a;display:inline-block;margin:18px 0;letter-spacing:.05em;text-shadow:1px 1px 0 #000}
  .title-poster .poster-spec{font-size:13px;color:#aaa;font-style:italic;margin-bottom:24px}
  .title-poster .poster-btn{font-family:inherit;font-size:22px;font-weight:900;padding:14px 56px;background:linear-gradient(180deg,#ff5a9a,#d92e6e);color:#fff;border:3px solid #fff;border-radius:40px;cursor:pointer;letter-spacing:.15em;box-shadow:5px 5px 0 #000,0 0 28px rgba(255,90,154,.6);animation:posterPulse 1.5s ease-in-out infinite;text-shadow:2px 2px 0 #000}
  .title-poster .poster-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
  @keyframes posterPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05);filter:brightness(1.2)}}
  .title-poster .poster-sub-btn{margin-top:14px;font-family:inherit;font-size:13px;padding:6px 18px;background:transparent;color:#5af0e0;border:1px solid #5af0e0;border-radius:18px;cursor:pointer}
  /* 浮かぶオノマトペ（旧版、未使用に） */
  .fx-float{position:absolute;width:160px;height:160px;opacity:.7;pointer-events:none;z-index:3;filter:drop-shadow(3px 3px 0 #000);display:none}
  .fx-f1{top:6%;left:1%;animation:fxFloat1 4.5s ease-in-out infinite}
  .fx-f2{top:14%;right:1%;animation:fxFloat2 4s ease-in-out infinite;animation-delay:.8s}
  .fx-f3{bottom:24%;left:2%;animation:fxFloat3 5s ease-in-out infinite;animation-delay:1.5s;width:130px;height:130px}
  .fx-f4{bottom:18%;right:2%;animation:fxFloat4 4.2s ease-in-out infinite;animation-delay:2.2s;width:130px;height:130px}
  @keyframes fxFloat1{0%,100%{transform:translateY(0) rotate(-8deg) scale(1)}50%{transform:translateY(-18px) rotate(5deg) scale(1.08)}}
  @keyframes fxFloat2{0%,100%{transform:translateY(0) rotate(6deg) scale(1)}50%{transform:translateY(-20px) rotate(-4deg) scale(.95)}}
  @keyframes fxFloat3{0%,100%{transform:translateY(0) rotate(-5deg) scale(1)}50%{transform:translateY(15px) rotate(8deg) scale(1.05)}}
  @keyframes fxFloat4{0%,100%{transform:translateY(0) rotate(7deg) scale(1)}50%{transform:translateY(18px) rotate(-6deg) scale(.92)}}
  /* ベストスコアバッジ */
  .best-badge{position:absolute;top:14px;right:14px;background:linear-gradient(135deg,#ffd23a,#d4a020);color:#000;padding:6px 14px 6px 18px;border:3px solid #000;border-radius:12px;font-weight:900;font-size:13px;letter-spacing:.05em;z-index:4;box-shadow:3px 3px 0 #000;transform:rotate(3deg)}
  .best-badge::before{content:"👑 ";font-size:14px}
  .best-badge .v{color:#d92e2e;font-family:Consolas,monospace;font-size:15px;margin-left:4px}
  /* チャレンジバナー */
  .challenge-banner{background:linear-gradient(90deg,#d92e2e,#ff5a9a);color:#fff;font-weight:900;padding:8px 24px;border:3px solid #000;border-radius:24px;font-size:14px;letter-spacing:.05em;text-shadow:2px 2px 0 #000;box-shadow:4px 4px 0 #000;margin-bottom:8px;transform:rotate(-1deg);text-align:center}
  /* 客タイプ並び */
  .title-cast{display:flex;justify-content:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;max-width:520px}
  .title-cast-item{background:rgba(0,0,0,.8);border:3px solid #fff;border-radius:10px;padding:6px 8px;font-size:11px;color:#ff8ad0;text-align:center;min-width:68px;box-shadow:2px 2px 0 #000}
  .title-cast-item .emo{font-size:22px;display:block;line-height:1.2}
  .title-cast-item .lbl{font-size:9px;color:#aaa;letter-spacing:0;display:block;margin-top:2px}
  /* デモボックス内のトランジション */
  .demo-quest, .demo-choices, .demo-inner { transition: opacity .35s }
  .demo-fade { opacity: 0 }
  /* ハイスコア風バナー */
  .title-banner{background:linear-gradient(90deg,#000,rgba(255,90,154,.4),#000);padding:8px 18px;font-size:13px;color:#ffd23a;text-align:center;border-top:1px solid #ff5a9a;border-bottom:1px solid #ff5a9a;letter-spacing:.05em;font-weight:bold;animation:bannerScroll 8s linear infinite;background-size:200% 100%}
  @keyframes bannerScroll{0%{background-position:0% 0}100%{background-position:200% 0}}
  .title-btn{font-family:inherit;font-size:20px;font-weight:900;padding:12px 50px;background:linear-gradient(180deg,#ff5a9a,#d92e6e);color:#fff;border:3px solid #000;border-radius:14px;cursor:pointer;letter-spacing:.12em;box-shadow:4px 4px 0 #000,0 6px 24px rgba(255,90,154,.6);animation:pulse 1.5s ease-in-out infinite;text-shadow:2px 2px 0 #000;margin-top:6px}
  .title-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a1040}
  .title-credit{margin-top:14px;color:#888;font-size:10px;font-style:italic;text-shadow:0 1px 2px #000}

  /* 動画 */
  .opening-screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;flex-direction:column}
  .opening-screen video{width:100%;height:100%;object-fit:contain}
  .opening-placeholder{text-align:center;color:#fff;padding:40px;background:radial-gradient(circle,#3a0a3a 0%,#000 100%);width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .opening-placeholder .icon{font-size:120px;margin-bottom:20px;animation:floaty 2s ease-in-out infinite}
  .opening-placeholder .label{font-size:14px;color:#ff8ad0;letter-spacing:.2em;margin-bottom:10px}
  .opening-placeholder .hint{font-size:12px;color:#666;font-style:italic;margin-top:30px;max-width:500px;line-height:1.7}

  /* 紙芝居 */
  .kami-screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#000;cursor:pointer}
  .kami-img-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden}
  .kami-img{max-width:100%;max-height:100%;object-fit:contain;animation:fadeIn .6s ease-out}
  .kami-placeholder{width:80%;max-width:600px;aspect-ratio:1/1;background:linear-gradient(135deg,#3a0a3a,#1a0014,#5a1a3a);border:2px dashed #ff5a9a;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ff8ad0;animation:fadeIn .6s ease-out}
  .kami-placeholder.go{background:linear-gradient(135deg,#1a0014,#000,#3a0a1a);border-color:#888;color:#888}
  .kami-placeholder .ico{font-size:120px;margin-bottom:20px}
  .kami-placeholder .num{font-size:14px;color:#888;letter-spacing:.2em;font-family:Consolas,monospace}
  .kami-placeholder .filename{font-size:11px;color:#555;margin-top:6px;font-family:Consolas,monospace}
  @keyframes fadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  .kami-caption{background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,.97));padding:24px 36px 28px;text-align:left;border-top:2px solid #ff5a9a;min-height:200px;max-height:45vh;overflow-y:auto}
  .kami-caption.go{border-top-color:#888}
  .kami-caption .text{font-size:16px;color:#fff;line-height:1.85;text-shadow:0 0 4px rgba(255,90,154,.5);animation:typeIn .8s ease-out;max-width:780px;margin:0 auto}
  .kami-caption .hint{margin-top:12px;font-size:11px;color:#888;font-style:italic;animation:blink 1.5s ease-in-out infinite}
  .kami-caption .chapter{font-size:10px;color:#ffd23a;letter-spacing:.2em;margin-bottom:6px;font-family:Consolas,monospace}
  @keyframes typeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes blink{50%{opacity:.4}}

  /* ゲーム */
  .game-screen{position:absolute;inset:0;overflow-y:auto;background:linear-gradient(180deg,#0a0014,#2a0a3a,#3a0a2a);padding:12px;display:flex;flex-direction:column;align-items:center}
  .game-top{display:flex;gap:10px;width:100%;max-width:680px;align-items:flex-start;margin-bottom:6px}
  .girl-portrait{width:96px;height:96px;border-radius:12px;background:#1a0a1a;border:2px solid #ff5a9a;display:flex;align-items:center;justify-content:center;font-size:48px;flex-shrink:0;overflow:hidden;position:relative}
  .girl-portrait img{width:100%;height:100%;object-fit:cover}
  .girl-portrait .state{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;color:#fff;background:rgba(0,0,0,.6);padding:1px 0}
  .game-title-row{flex:1}
  .game-title-row h1{font-size:18px;color:#ff8ad0;text-shadow:0 0 12px #ff5a9a;margin-bottom:2px}
  .game-title-row .sub{color:#888;font-size:10px;font-style:italic;margin-bottom:6px}
  .hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#0a0014;padding:8px 12px;border-radius:10px;border:2px solid #ff5a9a}
  .h-item{text-align:center}
  .h-lbl{font-size:9px;color:#aaa;letter-spacing:.05em}
  .h-val{font-size:15px;font-weight:bold;font-family:Consolas,monospace}
  .h-val.money{color:#ffd23a}
  .h-val.mental{color:#5af0a0}
  .h-val.quota{color:#ff5a9a}
  .h-val.cust{color:#aaa}
  .h-val.combo{color:#ff5a9a}
  .h-val.time{color:#5af0a0}
  .quota-bar{width:100%;max-width:680px;height:5px;background:#1a0a1a;border-radius:3px;overflow:hidden;margin-bottom:8px}
  .quota-bar .fill{height:100%;background:linear-gradient(90deg,#ff5a9a,#ffd23a);transition:width .3s}
  .qbar-wrap{position:absolute;top:6px;right:14px;width:140px;height:10px;background:rgba(0,0,0,.6);border:1px solid #5a2a5a;border-radius:6px;overflow:hidden}
  .qbar-fill{height:100%;background:linear-gradient(90deg,#5af0a0,#ffd23a,#ff5050);transition:width .1s linear;width:100%}
  .qbar-wrap.warn{animation:blink .3s linear infinite}
  .choice.correct{background:#5af0a0!important;color:#000!important;border-color:#5af0a0!important;animation:shake .15s}
  .choice.wrong{background:#ff5050!important;color:#fff!important;border-color:#ff5050!important;animation:shake .15s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .stage{width:100%;max-width:680px;background:#1a0014;border-radius:14px;padding:12px;border:2px solid #ff5a9a}
  .customer{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#2a0a2a;border-radius:12px;margin-bottom:8px}
  .c-face{width:64px;height:64px;border-radius:10px;background:#0a0014;border:1px solid #ff5a9a;display:flex;align-items:center;justify-content:center;font-size:38px;flex-shrink:0;overflow:hidden}
  .c-face img{width:100%;height:100%;object-fit:cover}

<button id="bgm">🎵 BGM ON</button>
<button id="skip" class="hide">スキップ ⏭ (Esc)</button>

<div id="root"></div>

<script>
// =========================================================================
// 画像パスマップ
// =========================================================================
const IMG = {
  title: '画像/title.png',
  girlGood: '画像/嬢_営業スマイル.png',
  girlMid:  '画像/嬢_心の闇.png',
  girlBad:  '画像/嬢_疲弊裏顔.png',
  cust: {
    説教: '画像/客_説教おじさん.png',
    自慢: '画像/客_自慢ロレックス.png',
    セクハラ: '画像/客_粘着セクハラ.png',
    金欠: '画像/客_金欠ヤンキー.png',
    粘着: '画像/客_粘着メンヘラ.png',
    比較: '画像/客_比較侮辱.png',
    神客: '画像/客_VIP神客.png',
  },
  champagne: '画像/物_シャンパンタワー.png',
  bill: '画像/物_お会計伝票.png',
};

// 画像のオートロード判定キャッシュ
const imgExists = {};
function checkImg(path){
  if(imgExists[path] !== undefined) return Promise.resolve(imgExists[path]);
  return new Promise(res=>{
    const im = new Image();
    im.onload = ()=>{ imgExists[path] = true; res(true); };
    im.onerror = ()=>{ imgExists[path] = false; res(false); };
    im.src = path;
  });
}

// =========================================================================
// BGM (WebAudio・lofi シティポップ風)
// =========================================================================
let ac = null, masterGain = null, bgmPlaying = false, bgmTimer = null;
function initAudio(){
  if(ac) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  ac = new AC();
  masterGain = ac.createGain();
  masterGain.gain.value = 0.15;
  masterGain.connect(ac.destination);
}
const PROG = [
  [220.00, 261.63, 329.63, 261.63],
  [174.61, 220.00, 261.63, 220.00],
  [130.81, 196.00, 261.63, 196.00],
  [196.00, 246.94, 293.66, 246.94],
];
let bgmStep = 0;
function bgmTick(){
  if(!ac || !bgmPlaying) return;
  const chord = PROG[Math.floor(bgmStep/4)%4];
  const note = chord[bgmStep%4];
  const o = ac.createOscillator(), g = ac.createGain();
  o.type='triangle'; o.frequency.value = note*2;
  g.gain.value=0;
  g.gain.linearRampToValueAtTime(0.08, ac.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.35);
  o.connect(g); g.connect(masterGain);
  o.start(); o.stop(ac.currentTime+0.4);
  if(bgmStep%4 === 0){
    const bo=ac.createOscillator(), bg=ac.createGain();
    bo.type='sine'; bo.frequency.value = chord[0]/2;
    bg.gain.value=0;
    bg.gain.linearRampToValueAtTime(0.18, ac.currentTime+0.02);
    bg.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.55);
    bo.connect(bg); bg.connect(masterGain);
    bo.start(); bo.stop(ac.currentTime+0.6);
  }
  if(bgmStep%16 === 0){
    [chord[0], chord[2]].forEach(f=>{
      const po=ac.createOscillator(), pg=ac.createGain();
      po.type='sawtooth'; po.frequency.value=f;
      pg.gain.value=0;
      pg.gain.linearRampToValueAtTime(0.025, ac.currentTime+0.3);
      pg.gain.linearRampToValueAtTime(0.025, ac.currentTime+1.8);
      pg.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+2.0);
      po.connect(pg); pg.connect(masterGain);
      po.start(); po.stop(ac.currentTime+2.0);
    });
  }
  bgmStep++;
}
function startBGM(){
  initAudio();
  if(ac.state==='suspended') ac.resume();
  if(bgmPlaying) return;
  bgmPlaying = true; bgmStep = 0;
  bgmTimer = setInterval(bgmTick, 200);

}
function stopBGM(){
  bgmPlaying = false;
  if(bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; }
  document.getElementById('bgm').textContent = '🔇 BGM OFF';
}
function toggleBGM(){ bgmPlaying ? stopBGM() : startBGM(); }
function sfx(f,d,t='square',v=.1){
  if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=t; o.frequency.value=f; g.gain.value=v;
  g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+d);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+d);
}

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function loadKami(){
  // prologue_a は廃止、localStorage 内の旧データは無視
  try{
    const s = localStorage.getItem('kabaKamiData');
    if(s){
      const p = JSON.parse(s);
      // 旧データの prologue_b が10枚未満なら新DEFAULTで上書き（長文化対応）
      const newProB = (p.prologue_b && p.prologue_b.length === 10 && p.prologue_b[0].cap && p.prologue_b[0].cap.length > 50) ? p.prologue_b : deepClone(DEFAULT_PROLOGUE_B);
      const newEnd = (p.ending && p.ending.length === 10 && p.ending[0].cap && p.ending[0].cap.length > 50) ? p.ending : deepClone(DEFAULT_ENDING);
      const newGo = (p.gameover && p.gameover[0] && p.gameover[0].cap && p.gameover[0].cap.length > 50) ? p.gameover : deepClone(DEFAULT_GAMEOVER);
      return {
        prologue_a: [],
        prologue_b: newProB,
        ending:     newEnd,
        gameover:   newGo,
      };
    }
  }catch(e){}
  return {
    prologue_a: [],
    prologue_b: deepClone(DEFAULT_PROLOGUE_B),
    ending:     deepClone(DEFAULT_ENDING),
    gameover:   deepClone(DEFAULT_GAMEOVER),
  };
}

function go(target){
  scene = target;
  if(target==='title') renderTitle();
  else if(target==='opening') renderOpening();
  else if(target==='prologue_a'){
    // 前編は廃止：自動的に後編へスキップ
    go('prologue_b');
    return;
  }
  else if(target==='prologue_b'){ prologueBIdx=0; renderKami('prologue_b'); }
  else if(target==='game') renderGame();
  else if(target==='ending'){ endingIdx=0; renderKami('ending'); }
  else if(target==='gameover'){ gameoverIdx=0; renderKami('gameover'); }
  else if(target==='credits') renderCredits();
  else if(target==='edit') renderEdit();
  else if(target==='copyedit') renderCopyEdit();
  if(['opening','prologue_a','prologue_b','ending','gameover'].includes(target)){
    skipBtn.classList.remove('hide');
  } else {
    skipBtn.classList.add('hide');
  }
}
skipBtn.onclick = ()=>{
  if(scene==='opening') go('prologue_a');
  else if(scene==='prologue_a') go('prologue_b');
  else if(scene==='prologue_b') go('game');
  else if(scene==='ending') go('credits');
  else if(scene==='gameover') go('credits');
};

});

function startDemoRotation(){
  if(demoTimer) clearInterval(demoTimer);

  function update(){
    const d = DEMO_ROTATION[idx];
    const els = ['demoQuest','demoChoices','demoThink'].map(()=>null);
    const q = document.querySelector('#titleDemo .demo-quest');
    const c = document.querySelector('#titleDemo .demo-choices');
    const t = document.querySelector('#titleDemo .demo-inner');
    if(!q || !c || !t) return;
    q.classList.add('demo-fade');

    setTimeout(()=>{
      const icon = document.getElementById('demoIcon');
      const txt  = document.getElementById('demoText');
      const ok   = document.getElementById('demoOk');
      const ng   = document.getElementById('demoNg');
      const th   = document.getElementById('demoThink');
      if(icon) icon.textContent = d.face;
      if(txt)  txt.textContent  = d.q;
      if(ok)   ok.textContent   = '✓ ' + d.ok;
      if(ng)   ng.textContent   = '💣 ' + d.ng;
      if(th)   th.innerHTML     = '💭 ' + d.think;
      q.classList.remove('demo-fade');
      c.classList.remove('demo-fade');
      t.classList.remove('demo-fade');
    }, 380);
    idx = (idx + 1) % DEMO_ROTATION.length;
  }
  demoTimer = setInterval(update, 3500);
}

  let list, idx, chapter, isGameover = false;

  else if(mode==='prologue_b'){ list=KAMI.prologue_b; idx=prologueBIdx; chapter='PROLOGUE 後編'; }
  else if(mode==='ending'){ list=KAMI.ending; idx=endingIdx; chapter='ENDING'; }
  else if(mode==='gameover'){ list=KAMI.gameover; idx=gameoverIdx; chapter='GAME OVER'; isGameover=true; }

  const item = list[idx];
  root.innerHTML = `
    <div class="kami-screen" id="kamiScreen">

        <div class="kami-placeholder ${isGameover?'go':''}">

          <div class="num">${chapter} ${idx+1} / ${list.length}</div>
          <div class="filename">画像/${item.file}</div>
        </div>
      </div>
      <div class="kami-caption ${isGameover?'go':''}">
        <div class="chapter">${chapter}</div>
        <div class="text">${item.cap}</div>
        <div class="hint">クリック or Space で次へ ▶</div>
      </div>
    </div>
  `;
  const wrap = document.getElementById('imgWrap');
  checkImg(`画像/${item.file}`).then(ok=>{
    if(ok && scene===mode){
      const img = document.createElement('img');
      img.className = 'kami-img';
      img.src = `画像/${item.file}`;
      wrap.innerHTML = '';
      wrap.appendChild(img);
    }
  });
  document.getElementById('kamiScreen').onclick = advanceKami;
  sfxClick();
}
function advanceKami(){
  if(scene==='prologue_a'){
    prologueAIdx++;
    if(prologueAIdx >= KAMI.prologue_a.length) go('prologue_b');
    else renderKami('prologue_a');
  } else if(scene==='prologue_b'){
    prologueBIdx++;
    if(prologueBIdx >= KAMI.prologue_b.length) go('game');
    else renderKami('prologue_b');
  } else if(scene==='ending'){
    endingIdx++;
    if(endingIdx >= KAMI.ending.length) go('credits');
    else renderKami('ending');
  } else if(scene==='gameover'){
    gameoverIdx++;
    if(gameoverIdx >= KAMI.gameover.length) go('credits');
    else renderKami('gameover');
  }
}

function saveKami(){
  try{
    localStorage.setItem('kabaKamiData', JSON.stringify(KAMI));
    showToast('💾 保存しました');
  }catch(e){ alert('保存失敗: ' + e.message); }
}
function resetKami(){
  if(!confirm('編集内容をすべてデフォルトに戻す？')) return;
  KAMI.prologue_a = deepClone(DEFAULT_PROLOGUE_A);
  KAMI.prologue_b = deepClone(DEFAULT_PROLOGUE_B);
  KAMI.ending     = deepClone(DEFAULT_ENDING);
  KAMI.gameover   = deepClone(DEFAULT_GAMEOVER);
  localStorage.removeItem('kabaKamiData');
  renderEdit();
  showToast('🔄 リセットしました');
}
function moveItem(key, idx, delta){
  const arr = KAMI[key];
  const newIdx = idx + delta;
  if(newIdx < 0 || newIdx >= arr.length) return;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  renderEdit();
  // 編集中スクロール位置維持はあきらめる（簡素化）
}
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'edit-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1800);
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderEditItem(key, idx, item, total){
  const options = AVAILABLE_IMAGES.map(f=>{
    const sel = f === item.file ? 'selected' : '';
    return `<option value="${escapeHtml(f)}" ${sel}>${f||'(画像なし)'}</option>`;
  }).join('');
  const imgHtml = item.file ? `<img src="画像/${item.file}" alt="">` : '画像なし';
  return `
    <div class="edit-item">
      <div class="edit-item-num">${idx+1}</div>
      <div class="edit-item-img">${imgHtml}</div>
      <div class="edit-item-controls">
        <div class="edit-item-top">
          <input class="edit-ico" data-key="${key}" data-idx="${idx}" value="${escapeHtml(item.ico)}" placeholder="絵文字">
          <select class="edit-file" data-key="${key}" data-idx="${idx}">${options}</select>
        </div>
        <textarea class="edit-cap" data-key="${key}" data-idx="${idx}" placeholder="キャプション">${escapeHtml(item.cap)}</textarea>
      </div>
      <div class="edit-item-buttons">
        <button onclick="moveItem('${key}',${idx},-1)" ${idx===0?'disabled':''} title="上へ">↑</button>
        <button onclick="moveItem('${key}',${idx},1)" ${idx===total-1?'disabled':''} title="下へ">↓</button>
      </div>
    </div>
  `;
}
function renderEditSection(key, label, items){
  return `
    <div class="edit-section">
      <h3>📖 ${label}（${items.length}枚）</h3>
      ${items.map((it,i)=>renderEditItem(key, i, it, items.length)).join('')}
    </div>
  `;
}

let G = null;
const TARGET_SCORE = 3000;
const TIME_LIMIT = 60;
const Q_LIMIT = 10;

function flattenScenes(){
  const all = [];
  for(const type of Object.keys(SCENES)){
    for(const s of SCENES[type]){
      all.push({type, q:s.q, ch:s.ch});
    }
  }
  return all;
}
const QPOOL = flattenScenes();

function renderGame(){
  G = {score:0, combo:0, qCount:0, correctCount:0, timeLeft:TIME_LIMIT, busy:false, globalTimer:null, qTimer:null, startTime:0, maxCombo:0, lastBonus:0, recentTypes:[], recentQs:[]};
  root.innerHTML = `
    <div class="comic-screen">
      <div class="comic-wrap">
        <div class="comic-top">
          <div class="comic-girl">
            <div class="face-wrap"><span id="girlEmoji">💁‍♀️</span></div>
            <div class="state" id="girlState">余裕</div>
          </div>
          <div class="comic-title-box">
            <h1>開店中：秒速反応スプリント</h1>
            <div class="sub">60秒以内に正解選択肢を連打せよ、各問10秒以内、ミスでCOMBO0</div>
          </div>
          <div class="comic-time" id="comicTime">
            <div class="lbl">TIME</div>
            <div class="val" id="time">60</div>

          </div>
        </div>
        <div class="comic-hud">
          <div class="item"><div class="l">SCORE</div><div class="v score" id="score">0</div></div>

        </div>

        <div class="comic-log" id="log"></div>
      </div>
    </div>
  `;
  updateGirlPortrait();
  showFx('演出_ドン.png', 900);
  setTimeout(()=>{ startGlobalTimer(); nextQ(); }, 500);
}

function startGlobalTimer(){
  G.startTime = performance.now();
  G._hurryFired = false;
  G.globalTimer = setInterval(()=>{
    const el = performance.now() - G.startTime;
    const total = TIME_LIMIT * 1000;
    const prev = G.timeLeft;
    G.timeLeft = Math.max(0, Math.ceil((total - el) / 1000));
    if(!G._hurryFired && G.timeLeft <= 10 && G.timeLeft > 0){
      G._hurryFired = true;
      showFx('演出_急げ.png', 1000);
    }
    const t = document.getElementById('time');
    if(t){
      t.textContent = String(G.timeLeft).padStart(3,'0');
    }
    const ct = document.getElementById('comicTime');
    if(ct){
      if(G.timeLeft <= 10) ct.classList.add('warn');
      else ct.classList.remove('warn');
    }
    updateGirlPortrait();
    if(el >= total){
      clearInterval(G.globalTimer);
      G.globalTimer = null;
      if(G.qTimer){ clearInterval(G.qTimer); G.qTimer = null; }
      endGameSession();
    }
  }, 100);
}

function updateGirlPortrait(){
  if(!G) return;
  const e = document.getElementById('girlEmoji');
  const s = document.getElementById('girlState');
  if(!e || !s) return;
  let path, emoji, state;
  if(G.timeLeft > 40){ path = IMG.girlGood; emoji = '💁‍♀️'; state = '余裕'; }
  else if(G.timeLeft > 20){ path = IMG.girlMid; emoji = '😤'; state = 'キツい'; }
  else { path = IMG.girlBad; emoji = '😩'; state = '限界'; }
  if(e.querySelector('img')) {} else e.textContent = emoji;
  s.textContent = state;
  checkImg(path).then(ok=>{
    if(ok){ e.innerHTML = `<img src="${path}" alt="">`; }
  });
}

function nextQ(){
  if(!G || G.timeLeft <= 0) return;
  G.busy = false;
  const q = QPOOL[Math.floor(Math.random()*QPOOL.length)];
  const t = TYPES[q.type];
  const name = t.names[Math.floor(Math.random()*t.names.length)];
  const shuffled = [...q.ch].sort(()=>Math.random()-0.5);
  G.qCount++;

  document.getElementById('stage').innerHTML = `
    <div class="comic-stage">
      <div class="comic-cust">
        <div class="face" id="cFace"><span id="cEmoji">${t.face}</span></div>
        <div class="name">${name}</div>
        <div class="tag">${t.tag}</div>
      </div>
      <div class="comic-right">
        <div class="comic-bubble">${q.q}</div>
        <div class="comic-bar-row" id="qbarwrap">
          <span class="clock">⏱</span>
          <span class="lbl">反応ゲージ</span>
          <div class="bar"><div class="fill" id="qbarfill"></div></div>
          <span class="hurry">急げ!!</span>
        </div>
        <div class="comic-choices" id="choices"></div>
      </div>
    </div>
  `;
  const custPath = IMG.cust[q.type];
  if(custPath){
    checkImg(custPath).then(ok=>{
      if(ok && document.getElementById('cEmoji')){
        document.getElementById('cEmoji').innerHTML = `<img src="${custPath}" alt="">`;
      }
    });
  }
  const cEl = document.getElementById('choices');
  shuffled.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className = 'comic-choice';
    b.innerHTML = `<div class="num">${i+1}</div><span class="lip">「${c[0]}」</span><span class="think">💭 ${c[1]}</span>`;
    b.onclick = ()=>answer(b, c);
    cEl.appendChild(b);
  });

  const qStart = performance.now();
  const qLimitMs = Q_LIMIT * 1000;
  const qbarFill = document.getElementById('qbarfill');
  const qbarWrap = document.getElementById('qbarwrap');
  G.qTimer = setInterval(()=>{
    const e = performance.now() - qStart;
    const r = Math.max(0, qLimitMs - e);
    const pct = Math.max(0, r / qLimitMs * 100);
    if(qbarFill) qbarFill.style.width = pct + '%';
    if(qbarWrap && pct <= 20) qbarWrap.classList.add('warn');
    if(r <= 0){
      clearInterval(G.qTimer);
      G.qTimer = null;
      miss();
    }
  }, 100);
}

function answer(btn, c){
  if(G.busy) return;
  G.busy = true;
  if(G.qTimer){ clearInterval(G.qTimer); G.qTimer = null; }
  const dMood = c[4];
  const isCorrect = dMood > 0;
  if(isCorrect){
    btn.classList.add('correct');
    G.combo++;
    if(G.combo > G.maxCombo) G.maxCombo = G.combo;
    G.correctCount++;
    const gain = 100 + G.combo * 20;
    G.score += gain;
    G.lastBonus = gain;
    sfxGood();
    showReact('+'+gain+'  💕', '#5af0a0');
    document.getElementById('log').textContent = `💭 ${c[1]}`;
    const bonusItem = document.getElementById('bonusItem');
    if(bonusItem){ bonusItem.classList.remove('bonus-flash'); void bonusItem.offsetWidth; bonusItem.classList.add('bonus-flash'); }
    // 演出オーバーレイ
    if(G.combo >= 3){ showFx('演出_COMBO.png', 800); }
    else { showFx('演出_正解.png', 600); }
  } else {
    btn.classList.add('wrong');
    G.combo = 0;
    G.lastBonus = 0;
    sfxBad();
    showReact('💣 地雷', '#ff5050');
    document.getElementById('log').textContent = `💭 ${c[1]}`;
    showFx('演出_地雷.png', 700);
  }
  updateHud();
  setTimeout(()=>{
    if(G && G.timeLeft > 0) nextQ();
  }, 500);
}

function miss(){
  if(!G) return;
  G.busy = true;
  G.combo = 0;
  sfxBad();
  showReact('⏰ 時間切れ', '#ff5050');
  document.getElementById('log').textContent = '客が痺れを切らした…';
  updateHud();
  setTimeout(()=>{
    if(G && G.timeLeft > 0) nextQ();
  }, 500);
}

function showReact(t,c){
  const r=document.createElement('div');
  r.className='react'; r.textContent=t; r.style.color=c;
  r.style.left=(window.innerWidth/2-30)+'px';
  r.style.top=(window.innerHeight/2-30)+'px';
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),1200);
}

function showFx(file, duration=900){
  checkImg('画像/' + file).then(ok=>{
    if(!ok) return;
    const ov = document.createElement('div');
    ov.className = 'fx-overlay';
    const im = document.createElement('img');
    im.src = '画像/' + file;
    ov.appendChild(im);
    document.body.appendChild(ov);
    setTimeout(()=>ov.classList.add('fade'), Math.max(0, duration-350));
    setTimeout(()=>ov.remove(), duration);
  });
}

function updateHud(){
  const s=document.getElementById('score'); if(s) s.textContent = G.score.toLocaleString();
  const co=document.getElementById('combo'); if(co){
    co.textContent = '×' + G.combo;
    co.style.color = G.combo >= 5 ? '#ffd23a' : G.combo >= 3 ? '#ff8ad0' : '#ff5a9a';
  }
  const bn=document.getElementById('bonus'); if(bn){
    bn.textContent = '+' + (G.lastBonus||0).toLocaleString();
  }
  const pct = Math.min(100, Math.floor(G.score/TARGET_SCORE*100));
  const q=document.getElementById('quota'); if(q) q.textContent = pct + '%';
}

function endGameSession(){
  if(G.qTimer) clearInterval(G.qTimer);
  if(G.globalTimer) clearInterval(G.globalTimer);
  window._lastResult = {score:G.score, combo:G.maxCombo, questions:G.qCount, correct:G.correctCount};
  // BEST 更新
  try{
    const best = +(localStorage.getItem('kabaBestScore') || 0);
    if(G.score > best) localStorage.setItem('kabaBestScore', String(G.score));
  }catch(e){}
  const cleared = G.score >= TARGET_SCORE;
  showFx('演出_TIMEUP.png', 1500);
  setTimeout(()=>{
    if(cleared) go('ending');
    else go('gameover');
  }, 1600);
}

  const r = window._lastResult || {score:0, combo:0, questions:0, correct:0};
  const cleared = r.score >= TARGET_SCORE;
  let grade, title, msg, gradeImg;
  if(r.score >= 6000){
    grade='👑'; title='ナンバーワン';
    msg='伝説の反射神経。COMBOの女王、地雷ゼロ。';
    gradeImg = '画像/嬢_営業スマイル.png';
  } else if(r.score >= 4500){
    grade='💎'; title='指名嬢';
    msg='余裕で目標達成。地雷判定は完璧。';
    gradeImg = '画像/嬢_営業スマイル.png';
  } else if(cleared){
    grade='🌟'; title='目標クリア';
    msg='今夜も生き延びた。次は更に高みへ。';
    gradeImg = '画像/嬢_営業スマイル.png';
  } else if(r.score < 300){
    grade='💩'; title='ノルマ未達・罰金';
    msg='地雷踏みまくり。源氏名変えて出直す？';
    gradeImg = '画像/嬢_疲弊裏顔.png';
  } else {
    grade='😐'; title='かろうじて生存';
    msg='目標未達。来月はもうちょい集中。';
    gradeImg = '画像/嬢_心の闇.png';
  }
  const bgImg = cleared ? '画像/エンディング_10.png' : '画像/ゲームオーバー.png';
  root.innerHTML = `
    <div class="credit-screen">
      <div class="credit-bg" id="creditBg"></div>
      <div class="credit-overlay"></div>
      <img class="grade-img" id="gradeImg" src="${gradeImg}" alt="" onerror="this.style.display='none';document.getElementById('gradeEmoji').style.display='block'">
      <div class="grade" id="gradeEmoji" style="display:none">${grade}</div>
      <h2>${title}</h2>
      <div class="nums">
        ⚡SCORE <b>${r.score}</b><br>
        ✓正解 <b>${r.correct} / ${r.questions}</b><br>
        🔥最大COMBO <b>${r.combo}</b><br>
        🎯目標 <b>${TARGET_SCORE}</b>　${cleared?'<span style="color:#5af0a0">✓達成</span>':'<span style="color:#ff5050">✗未達</span>'}
      </div>
      <div class="msg">${msg}</div>
      <button onclick="location.reload()">🔄 また明日も出勤</button>
    </div>
  `;
  checkImg(bgImg).then(ok=>{
    if(ok) document.getElementById('creditBg').style.backgroundImage = `url("${bgImg}")`;
  });
}
